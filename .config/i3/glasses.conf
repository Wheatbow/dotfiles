# Termux:X11 on the Viture XR Pro. Selected with `wm glasses`.
# Set before the include: this file's variables are visible to the included
# config, but variables defined in the included file are not visible here.
set $i3font pango:monospace 10
set $termfont monospace:size=10

# GDK/GTK apps (Firefox, file dialogs, ...) take their scale from the Xft.dpi
# X resource, not from the server DPI. Set it in the running server; no file.
exec --no-startup-id echo Xft.dpi: 168 | xrdb -merge -

include ~/.config/i3/config
